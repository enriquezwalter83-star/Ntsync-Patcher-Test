name: Android Common GKI 5.10 NTSync

'on':
  workflow_dispatch:
    inputs:
      kernel_release:
        description: 'Rama del kernel Android Common'
        required: true
        type: choice
        options:
          - common-android12-5.10
      ntsync:
        description: 'Aplicar parches NTSync'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android Common GKI
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libncurses-dev libssl-dev lz4 make python3 rsync curl

      - name: Instalar repo
        run: |
          mkdir -p "$HOME/.bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/.bin/repo"
          chmod +x "$HOME/.bin/repo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Descargar Android Common
        env:
          KERNEL_BRANCH: ${{ inputs.kernel_release }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-src"
          cd "$GITHUB_WORKSPACE/kernel-src"
          repo init -u https://android.googlesource.com/kernel/manifest -b "$KERNEL_BRANCH"
          repo sync -c -j2 --no-clone-bundle

      - name: Verificar archivos
        working-directory: kernel-src
        run: |
          set -euo pipefail
          test -f common/Makefile
          test -f build/build.sh
          test -f common/build.config.gki.aarch64
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' common/Makefile

      - name: Aplicar parches NTSync
        if: ${{ inputs.ntsync }}
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel-src/common
        run: |
          set -euo pipefail
          test -f scripts/apply_ntsync.sh
          bash scripts/apply_ntsync.sh

      - name: Compilar kernel
        working-directory: kernel-src
        env:
          BUILD_CONFIG: common/build.config.gki.aarch64
          OUT_DIR: ${{ github.workspace }}/kernel-src/out
        run: |
          set -euo pipefail
          build/build.sh

      - name: Preparar artefactos
        working-directory: kernel-src
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist-artifacts"
          find out -type f \( -name Image -o -name Image.gz -o -name Image.lz4 -o -name '*.dtb' -o -name '*.dtbo' \) -exec cp --parents '{}' "$GITHUB_WORKSPACE/dist-artifacts/" \;
          test -n "$(find "$GITHUB_WORKSPACE/dist-artifacts" -type f -print -quit)"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: android-common-gki-5.10
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 7
