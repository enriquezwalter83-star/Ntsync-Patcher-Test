
name: Universal GKI Builder

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository URL"
        required: true
        default: "https://android.googlesource.com/kernel/common"
        type: string

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "android12-5.10"
        type: string

      ntsync:
        description: "Apply NTSync patches (only kernel 5.10)"
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Setup Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make clang llvm patch

      - name: Clone kernel
        run: |
          set -euo pipefail
          mkdir -p kernel

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" \
            kernel/common


      - name: Kernel information
        working-directory: kernel/common
        run: |
          echo "===== Kernel information ====="
          echo "Repository:"
          git remote get-url origin

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Android kernel config:"
          grep -E '^(CONFIG_ANDROID|CONFIG_GKI|CONFIG_NTSYNC)=' .config 2>/dev/null || true


      - name: Apply NTSync
        if: ${{ inputs.ntsync }}
        env:
          NTSYNC_ENABLED: "true"
        run: |
          chmod +x scripts/apply_ntsync.sh

          KVER=$(make -s -C kernel/common kernelversion)

          scripts/apply_ntsync.sh \
            kernel/common \
            "$KVER"

      - name: Skip NTSync
        if: ${{ !inputs.ntsync }}
        run: echo "NTSync disabled. Skipping patches."
