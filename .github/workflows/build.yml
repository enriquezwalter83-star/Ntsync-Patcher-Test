
name: Android GKI 5.10 Common Source Builder

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio Common Source (Google o tu fork base)"
        required: true
        default: "https://android.googlesource.com/kernel/common"
        type: string

      kernel_ref:
        description: "Tag o rama del kernel"
        required: true
        type: choice
        options:
          - android12-5.10.269_r00
          - android12-5.10.264_r00
          - android12-5.10.246_r00
          - android12-5.10.240_r00
          - android12-5.10.226_r00
          - android12-5.10-lts
          - android12-5.10
        default: android12-5.10.269_r00

      ntsync:
        description: "Aplicar y activar NTSync"
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build GKI 5.10 Common
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex \
            git libelf-dev libssl-dev python3 \
            python3-dev rsync unzip zip \
            cpio kmod pahole perl \
            libncurses-dev

      - name: Install Repo launcher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Android 12 GKI build environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10 \
            --depth=1

          repo sync -c -j2

          test -f build/build.sh
          test -f common/build.config.gki.aarch64

          echo "Build environment ready"

      - name: Fetch selected Common Source reference
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        shell: bash
        run: |
          set -euo pipefail

          K="$GITHUB_WORKSPACE/kernel/common"

          TAG_SHA="$(
            git ls-remote --refs "$KERNEL_REPO" \
              "refs/tags/$KERNEL_REF" |
              head -n 1 | cut -f1
          )"

          BRANCH_SHA="$(
            git ls-remote --heads "$KERNEL_REPO" \
              "refs/heads/$KERNEL_REF" |
              head -n 1 | cut -f1
          )"

          if [[ -n "$TAG_SHA" ]]; then
            echo "Fetching tag: $KERNEL_REF"

            git -C "$K" fetch --depth=1 "$KERNEL_REPO" \
              "refs/tags/$KERNEL_REF"

            git -C "$K" checkout --detach FETCH_HEAD

          elif [[ -n "$BRANCH_SHA" ]]; then
            echo "Fetching branch: $KERNEL_REF"

            git -C "$K" fetch --depth=1 "$KERNEL_REPO" \
              "refs/heads/$KERNEL_REF"

            git -C "$K" checkout -B selected-kernel FETCH_HEAD

          else
            echo "::error::Reference not found in repository"
            echo "Repository: $KERNEL_REPO"
            echo "Reference: $KERNEL_REF"
            exit 1
          fi

          echo "===== Common Source commit ====="
          git -C "$K" log -1 --format='%H%n%s'

          echo "===== Kernel version ====="
          make -s -C "$K" kernelversion

      - name: Apply NTSync patches
        if: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f scripts/apply_ntsync.sh ]]; then
            echo "::error::scripts/apply_ntsync.sh is missing"
            exit 1
          fi

          chmod +x scripts/apply_ntsync.sh

          KVER="$(make -s -C kernel/common kernelversion)"

          scripts/apply_ntsync.sh \
            kernel/common "$KVER"

      - name: Configure NTSync
        if: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -euo pipefail

          K="$GITHUB_WORKSPACE/kernel/common"
          CONFIG="$K/arch/arm64/configs/gki_defconfig"

          if ! grep -Rqs 'config NTSYNC' \
            "$K/drivers" "$K/init" "$K/kernel" \
            "$K/ipc" "$K/fs" "$K/include" 2>/dev/null; then
            echo "::error::NTSync Kconfig entry was not found"
            exit 1
          fi

          sed -i \
            -e '/^CONFIG_NTSYNC=/d' \
            -e '/^# CONFIG_NTSYNC is not set$/d' \
            "$CONFIG"

          printf '\nCONFIG_NTSYNC=y\n' >> "$CONFIG"

          grep -qx 'CONFIG_NTSYNC=y' "$CONFIG"

      - name: Build Android GKI Common Source
        shell: bash
        env:
          NTSYNC_ENABLED: ${{ inputs.ntsync }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          export OUT_DIR="$GITHUB_WORKSPACE/kernel-out"
          export DIST_DIR="$GITHUB_WORKSPACE/kernel-dist"

          echo "===== Build information ====="
          echo "Source: kernel/common"
          echo "Config: common/build.config.gki.aarch64"
          echo "NTSync: $NTSYNC_ENABLED"
          echo "Jobs: $(nproc)"

          BUILD_CONFIG=common/build.config.gki.aarch64 \
            build/build.sh -j"$(nproc)"

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail

          DIST="$GITHUB_WORKSPACE/kernel-dist"

          if [[ ! -d "$DIST" ]]; then
            echo "::error::Distribution directory missing"
            exit 1
          fi

          if ! find "$DIST" -type f -print -quit | grep -q .; then
            echo "::error::No build artifacts generated"
            exit 1
          fi

          echo "===== Generated files ====="
          find "$DIST" -maxdepth 2 -type f \
            -printf '%P (%s bytes)\n' | sort

          if [[ ! -f "$DIST/Image" ]]; then
            echo "::warning::Image not found at the root of DIST_DIR"
            find "$DIST" -type f -name Image -print
          fi

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-common-5.10.269-ntsync-${{ inputs.ntsync }}
          path: kernel-dist/
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          NTSYNC_ENABLED: ${{ inputs.ntsync }}
        shell: bash
        run: |
          echo "===== BUILD SUMMARY ====="
          echo "Repository: $KERNEL_REPO"
          echo "Reference: $KERNEL_REF"
          echo "NTSync: $NTSYNC_ENABLED"

          if [[ -f kernel/common/Makefile ]]; then
            echo "Kernel version:"
            make -s -C kernel/common kernelversion || true

            echo "Commit:"
            git -C kernel/common rev-parse HEAD || true
          fi
