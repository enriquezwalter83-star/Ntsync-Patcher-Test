name: Patch GKI Kernel Source

on:
  workflow_dispatch:

    inputs:

      source_type:
        description: "Kernel source method"
        required: true
        type: choice
        options:
          - git
          - repo
        default: git


      git_url:
        description: "Git repository URL (GitHub/GitLab/etc)"
        required: false
        type: string


      git_ref:
        description: "Git branch/tag/commit"
        required: false
        type: string
        default: main


      repo_manifest:
        description: "Android kernel manifest URL"
        required: false
        type: string
        default: https://android.googlesource.com/kernel/manifest


      repo_branch:
        description: "Repo manifest branch"
        required: false
        type: string
        default: common-android12-5.10


      ntsync:
        description: "Apply NTSync patch"
        required: true
        type: boolean
        default: true


      kernelsu_next:
        description: "Apply KernelSU-Next"
        required: true
        type: boolean
        default: true



permissions:
  contents: read



jobs:


  patch:


    name: Patch kernel source


    runs-on: ubuntu-24.04


    timeout-minutes: 120



    steps:



    - name: Checkout patcher

      uses: actions/checkout@v4




    - name: Install dependencies

      shell: bash

      run: |

        set -e


        sudo apt update


        sudo apt install -y \
          bc \
          bison \
          flex \
          git \
          curl \
          python3 \
          repo \
          libssl-dev \
          libelf-dev \
          pahole



    #
    # DOWNLOAD SOURCE
    #


    - name: Download kernel source

      shell: bash

      run: |

        set -euo pipefail


        rm -rf kernel-source



        if [[ "${{ inputs.source_type }}" == "git" ]]; then


          if [[ -z "${{ inputs.git_url }}" ]]; then
            echo "::error::Missing git repository URL"
            exit 1
          fi



          echo "Cloning git kernel source"


          git clone \
            --depth=1 \
            --branch "${{ inputs.git_ref }}" \
            "${{ inputs.git_url }}" \
            kernel-source



        fi




        if [[ "${{ inputs.source_type }}" == "repo" ]]; then


          echo "Initializing Android repo source"



          mkdir kernel-source

          cd kernel-source



          repo init \
            -u "${{ inputs.repo_manifest }}" \
            -b "${{ inputs.repo_branch }}" \
            --depth=1



          repo sync \
            -c \
            --no-tags \
            -j$(nproc)



          cd ..

        fi




        echo "Source downloaded"


        find kernel-source -maxdepth 2 -name Makefile | head



    #
    # DETECT COMMON DIRECTORY
    #


    - name: Detect kernel directory

      id: kernel

      shell: bash

      run: |

        set -e



        if [[ -f kernel-source/Makefile ]]; then

          KERNEL_DIR=kernel-source


        elif [[ -f kernel-source/common/Makefile ]]; then

          KERNEL_DIR=kernel-source/common


        else

          echo "::error::Cannot find kernel Makefile"
          exit 1

        fi



        echo "Kernel directory: $KERNEL_DIR"


        echo "dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"




    #
    # KERNELSU NEXT
    #


    - name: Apply KernelSU-Next

      if: ${{ inputs.kernelsu_next }}

      shell: bash

      env:

        KERNEL_DIR: ${{ steps.kernel.outputs.dir }}


      run: |

        set -e



        cd "$KERNEL_DIR"



        echo "Applying KernelSU-Next"



        curl -LSs \
        https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh \
        | bash -



        echo "KernelSU-Next applied"




    #
    # NTSYNC
    #


    - name: Apply NTSync

      if: ${{ inputs.ntsync }}

      shell: bash

      env:

        KERNEL_DIR: ${{ steps.kernel.outputs.dir }}


      run: |

        set -e



        if [[ ! -f scripts/apply_ntsync.sh ]]; then

          echo "::error::NTSync patcher missing"

          exit 1

        fi



        bash scripts/apply_ntsync.sh "$KERNEL_DIR"



        echo "NTSync applied"




    #
    # SHOW RESULT
    #


    - name: Show applied features

      shell: bash

      env:

        KERNEL_DIR: ${{ steps.kernel.outputs.dir }}


      run: |

        set +e


        echo "Kernel directory:"
        echo "$KERNEL_DIR"



        echo


        echo "KSU symbols:"

        grep -R \
        "CONFIG_KSU" \
        "$KERNEL_DIR" \
        2>/dev/null || true



        echo


        echo "NTSync symbols:"

        grep -R \
        "CONFIG_NTSYNC" \
        "$KERNEL_DIR" \
        2>/dev/null || true




    #
    # UPLOAD PATCHED SOURCE
    #


    - name: Upload patched kernel source

      uses: actions/upload-artifact@v4


      with:

        name: patched-kernel-source

        path: kernel-source/

        retention-days: 7
