
name: Universal GKI Builder

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel repository URL"
        required: true
        default: "https://android.googlesource.com/kernel/common"
        type: string

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "android12-5.10"
        type: string

      ntsync:
        description: "Apply NTSync patches (only kernel 5.10)"
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Setup Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make clang llvm patch

      - name: Clone kernel
        run: |
          set -euo pipefail
          mkdir -p kernel

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_repo }}" \
            kernel/common


      - name: Kernel information
        working-directory: kernel/common
        run: |
          echo "===== Kernel information ====="
          echo "Repository:"
          git remote get-url origin

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"
          make -s kernelversion

          echo ""
          echo "Android kernel config:"
          grep -E '^(CONFIG_ANDROID|CONFIG_GKI|CONFIG_NTSYNC)=' .config 2>/dev/null || true

      - name: Show NTSync patch context
        if: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -u

          K=kernel/common
          P="$GITHUB_WORKSPACE/patches/ntsync/android12-5.10/ntsync_compat_android12-5.10.patch"

          echo "===== PATCH: complete diff headers and hunks ====="
          grep -nE '^(diff --git|--- |\+\+\+ |@@)' "$P" || true

          echo ""
          echo "===== PATCH: first 230 lines ====="
          sed -n '1,230p' "$P"

          echo ""
          echo "===== Kconfig ====="
          sed -n '250,310p' "$K/drivers/misc/Kconfig"

          echo ""
          echo "===== Makefile ====="
          sed -n '1,55p' "$K/drivers/misc/Makefile"

          echo ""
          echo "===== lockdep.h ====="
          sed -n '270,350p' "$K/include/linux/lockdep.h"

          echo ""
          echo "===== lockdep.c: declarations and helpers ====="
          sed -n '4770,4840p' "$K/kernel/locking/lockdep.c"

          echo ""
          echo "===== lockdep.c: lock held implementation ====="
          sed -n '5280,5355p' "$K/kernel/locking/lockdep.c"

          echo ""
          echo "===== lockdep.c: assertion implementation ====="
          sed -n '5570,5620p' "$K/kernel/locking/lockdep.c"
      
      - name: Apply NTSync
        if: ${{ inputs.ntsync }}
        env:
          NTSYNC_ENABLED: "true"
        run: |
          chmod +x scripts/apply_ntsync.sh

          KVER=$(make -s -C kernel/common kernelversion)

          scripts/apply_ntsync.sh \
            kernel/common \
            "$KVER"

      - name: Skip NTSync
        if: ${{ !inputs.ntsync }}
        run: echo "NTSync disabled. Skipping patches."
