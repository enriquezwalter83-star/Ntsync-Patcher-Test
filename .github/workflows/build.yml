
name: Universal GKI Builder

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio Android Common Kernel"
        required: true
        default: "https://android.googlesource.com/kernel/common"
        type: string

      kernel_ref:
        description: "Subnivel GKI 5.10 o rama LTS"
        required: true
        type: choice
        options:
          # Tags GKI 5.10 por subnivel
          - android12-5.10.226_r00
          - android12-5.10.240_r00
          - android12-5.10.246_r00
          - android12-5.10.264_r00
          - android12-5.10.269_r00

          # Rama LTS
          - android12-5.10-lts

          # Rama Android Common Kernel
          - android12-5.10

        default: android12-5.10.246_r00

      ntsync:
        description: "Aplicar parches NTSync"
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Prepare Android GKI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make clang llvm patch

      - name: Validate and clone GKI reference
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel

          echo "===== Repositorio ====="
          echo "$KERNEL_REPO"

          echo "===== Referencia seleccionada ====="
          echo "$KERNEL_REF"

          TAG_SHA="$(git ls-remote --refs "$KERNEL_REPO" \
            "refs/tags/$KERNEL_REF" | cut -f1)"

          BRANCH_SHA="$(git ls-remote --heads "$KERNEL_REPO" \
            "refs/heads/$KERNEL_REF" | cut -f1)"

          if [[ -z "$TAG_SHA" && -z "$BRANCH_SHA" ]]; then
            echo "::error::La referencia $KERNEL_REF no existe."
            exit 1
          fi

          if [[ -n "$TAG_SHA" ]]; then
            echo "Tipo de referencia: tag"
          else
            echo "Tipo de referencia: rama"
          fi

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" \
            kernel/common

          echo ""
          echo "===== Commit descargado ====="
          git -C kernel/common rev-parse HEAD

          echo ""
          echo "===== Tag exacto, si existe ====="
          git -C kernel/common describe \
            --tags --exact-match HEAD || true

          echo ""
          echo "===== Versión del kernel ====="
          make -s -C kernel/common kernelversion

      - name: Kernel information
        shell: bash
        run: |
          set -euo pipefail

          K=kernel/common

          echo "===== Repositorio ====="
          git -C "$K" remote get-url origin

          echo ""
          echo "===== Commit ====="
          git -C "$K" rev-parse HEAD

          echo ""
          echo "===== Versión ====="
          make -s -C "$K" kernelversion

          echo ""
          echo "===== Configuración disponible ====="
          grep -E '^(CONFIG_ANDROID|CONFIG_GKI|CONFIG_NTSYNC)=' \
            "$K/.config" 2>/dev/null || true

      - name: Inspect NTSync patch files
        if: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -euo pipefail

          P="patches/ntsync/android12-5.10"

          for name in \
            0001-lockdep-detect-recursive-read.patch \
            0002-lockdep-assert-none-held.patch \
            ntsync_compat_android12-5.10.patch \
            ntsync_base.patch
          do
            if [[ ! -f "$P/$name" ]]; then
              echo "::error::Falta el parche $P/$name"
              exit 1
            fi

            echo "Encontrado: $name"
          done

      - name: Apply NTSync
        if: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/apply_ntsync.sh

          KVER="$(make -s -C kernel/common kernelversion)"

          echo "===== Aplicando NTSync ====="
          echo "Versión detectada: $KVER"

          scripts/apply_ntsync.sh \
            kernel/common \
            "$KVER"

      - name: Skip NTSync
        if: ${{ !inputs.ntsync }}
        run: echo "NTSync desactivado; no se aplicarán parches."

      - name: Final summary
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
          NTSYNC_ENABLED: ${{ inputs.ntsync }}
        shell: bash
        run: |
          set -euo pipefail

          K=kernel/common

          echo "===== Resumen final ====="
          echo "Referencia: $KERNEL_REF"
          echo "Versión: $(make -s -C "$K" kernelversion)"
          echo "Commit: $(git -C "$K" rev-parse HEAD)"
          echo "NTSync activado: $NTSYNC_ENABLED"
          echo ""
          echo "Preparación y comprobaciones finalizadas."
          echo "Este workflow todavía no compila el kernel."
