name: Build Kernel 5.10 + NTSync

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Fuente del kernel"
        required: true
        type: choice
        options:
          - yuuka
          - android-common
          - custom
        default: yuuka

      repository_url:
        description: "URL Git personalizada (opcional)"
        required: false
        type: string
        default: ""

      kernel_ref:
        description: "Rama o tag del kernel"
        required: false
        type: string
        default: ""

      ntsync:
        description: "Aplicar parches NTSync"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Clone, patch and compile
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout patcher
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio flex \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang llvm lld \
            libelf-dev libssl-dev pahole \
            python3 rsync

      - name: Select kernel repository
        id: source
        shell: bash
        env:
          SELECTED_SOURCE: ${{ inputs.kernel_source }}
          CUSTOM_URL: ${{ inputs.repository_url }}
          CUSTOM_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euo pipefail

          case "$SELECTED_SOURCE" in
            yuuka)
              DEFAULT_URL="https://github.com/MillenniumOSS/android_kernel_common_android12-5.10.git"
              DEFAULT_REF="yuuka-main"
              ;;
            android-common)
              DEFAULT_URL="https://android.googlesource.com/kernel/common"
              DEFAULT_REF="android12-5.10.246_r00"
              ;;
            custom)
              DEFAULT_URL=""
              DEFAULT_REF=""
              ;;
            *)
              echo "::error::Unknown kernel source."
              exit 1
              ;;
          esac

          KERNEL_URL="$DEFAULT_URL"
          KERNEL_REF="$DEFAULT_REF"

          if [[ -n "${CUSTOM_URL//[[:space:]]/}" ]]; then
            KERNEL_URL="$CUSTOM_URL"
          fi

          if [[ -n "${CUSTOM_REF//[[:space:]]/}" ]]; then
            KERNEL_REF="$CUSTOM_REF"
          fi

          if [[ -z "$KERNEL_URL" ]]; then
            echo "::error::Enter a repository URL for custom source."
            exit 1
          fi

          if [[ -z "$KERNEL_REF" ]]; then
            echo "::error::Enter a branch or tag for this repository."
            exit 1
          fi

          echo "url=$KERNEL_URL" >> "$GITHUB_OUTPUT"
          echo "ref=$KERNEL_REF" >> "$GITHUB_OUTPUT"

          echo "Repository: $KERNEL_URL"
          echo "Reference: $KERNEL_REF"

      - name: Clone kernel
        id: kernel
        shell: bash
        env:
          KERNEL_REPO: ${{ steps.source.outputs.url }}
          KERNEL_REF: ${{ steps.source.outputs.ref }}
        run: |
          set -euo pipefail

          K="$GITHUB_WORKSPACE/kernel-source"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$KERNEL_REF" \
            "$KERNEL_REPO" "$K"

          if [[ ! -f "$K/Makefile" ]]; then
            echo "::error::Kernel Makefile not found in repository root."
            exit 1
          fi

          VERSION="$(make -s -C "$K" kernelversion)"

          echo "Detected kernel: $VERSION"

          if [[ ! "$VERSION" =~ ^5\.10\.[0-9]+([+-].*)?$ ]]; then
            echo "::error::Only Linux 5.10.x is supported. Detected: $VERSION"
            exit 1
          fi

          echo "dir=$K" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Commit:"
          git -C "$K" rev-parse HEAD

      - name: Apply NTSync patches
        if: ${{ inputs.ntsync }}
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.kernel.outputs.dir }}
          KERNEL_VERSION: ${{ steps.kernel.outputs.version }}
        run: |
          set -euo pipefail

          SCRIPT="$GITHUB_WORKSPACE/scripts/apply_ntsync.sh"

          if [[ ! -f "$SCRIPT" ]]; then
            echo "::error::scripts/apply_ntsync.sh not found."
            exit 1
          fi

          bash "$SCRIPT" "$KERNEL_DIR" "$KERNEL_VERSION"

      - name: Configure ARM64 kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.kernel.outputs.dir }}
          ENABLE_NTSYNC: ${{ inputs.ntsync }}
        run: |
          set -euo pipefail

          K="$KERNEL_DIR"
          OUT="$GITHUB_WORKSPACE/kernel-out"

          mkdir -p "$OUT"

          if [[ -f "$K/arch/arm64/configs/gki_defconfig" ]]; then
            DEFCONFIG="gki_defconfig"
          elif [[ -f "$K/arch/arm64/configs/defconfig" ]]; then
            DEFCONFIG="defconfig"
          else
            echo "::error::No ARM64 gki_defconfig or defconfig found."
            exit 1
          fi

          echo "Using $DEFCONFIG"

          make -C "$K" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          if [[ "$ENABLE_NTSYNC" == "true" ]]; then
            if ! grep -RqsE 'config NTSYNC([[:space:]]|$)' \
                "$K/drivers" "$K/kernel" "$K/fs" "$K/arch/arm64" \
                2>/dev/null; then
              echo "::error::NTSYNC Kconfig entry was not found."
              exit 1
            fi

            "$K/scripts/config" \
              --file "$OUT/.config" \
              --enable NTSYNC

            make -C "$K" \
              O="$OUT" \
              ARCH=arm64 \
              LLVM=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              olddefconfig

            if ! grep -q '^CONFIG_NTSYNC=y$' "$OUT/.config"; then
              echo "::error::CONFIG_NTSYNC is not enabled."
              exit 1
            fi
          fi

          cp "$OUT/.config" "$GITHUB_WORKSPACE/kernel-config"

      - name: Compile kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.kernel.outputs.dir }}
        run: |
          set -euo pipefail

          K="$KERNEL_DIR"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          JOBS="$(nproc)"

          echo "Building ARM64 kernel with $JOBS jobs"

          make -C "$K" \
            O="$OUT" \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$JOBS" \
            Image modules dtbs

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          echo "Generated files:"

          find "$GITHUB_WORKSPACE/kernel-out" \
            -type f \
            \( -name 'Image' \
            -o -name 'Image.gz' \
            -o -name 'Image.lz4' \
            -o -name 'vmlinux' \
            -o -name 'System.map' \
            -o -name '*.ko' \
            -o -name '*.dtb' \
            -o -name '*.dtbo' \
            -o -name '.config' \) \
            -printf '%p (%s bytes)\n' || true

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-${{ steps.kernel.outputs.version }}
          if-no-files-found: warn
          path: |
            kernel-out/**
            kernel-config
