set -euo pipefail

K="$GITHUB_WORKSPACE/kernel/common"

if [[ ! -d "$K/.git" ]]; then
  echo "::error::No existe un repositorio Git en $K"
  echo "Hay que revisar el paso anterior que descarga el kernel."
  exit 1
fi

# Crear origin si no existe; actualizarlo si ya existe.
if git -C "$K" remote get-url origin >/dev/null 2>&1; then
  git -C "$K" remote set-url origin "$KERNEL_REPO"
else
  git -C "$K" remote add origin "$KERNEL_REPO"
fi

TAG_SHA="$(
  git ls-remote --refs "$KERNEL_REPO" \
    "refs/tags/$KERNEL_REF" | cut -f1
)"

BRANCH_SHA="$(
  git ls-remote --heads "$KERNEL_REPO" \
    "refs/heads/$KERNEL_REF" | cut -f1
)"

if [[ -n "$TAG_SHA" ]]; then
  echo "Selected reference is a tag: $KERNEL_REF"

  git -C "$K" fetch --depth=1 origin \
    "refs/tags/$KERNEL_REF"

  git -C "$K" checkout --detach FETCH_HEAD

elif [[ -n "$BRANCH_SHA" ]]; then
  echo "Selected reference is a branch: $KERNEL_REF"

  git -C "$K" fetch --depth=1 origin \
    "refs/heads/$KERNEL_REF"

  git -C "$K" checkout -B selected-kernel FETCH_HEAD

else
  echo "::error::Reference not found: $KERNEL_REF"
  exit 1
fi

echo ""
echo "===== Selected commit ====="
git -C "$K" rev-parse HEAD

echo ""
echo "===== Detected kernel version ====="
make -s -C "$K" kernelversion
