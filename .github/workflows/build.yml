
name: NTSync Patch Test

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio Android Common Source"
        required: true
        type: string
        default: "https://android.googlesource.com/kernel/common"

      kernel_ref:
        description: "Tag o rama del kernel"
        required: true
        type: string
        default: "android12-5.10.269_r00"

jobs:
  test-patch:
    name: Clone and test NTSync patch
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            git python3 build-essential \
            bc bison flex libelf-dev libssl-dev

      - name: Clone Android Common Source
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel/common"
          cd "$GITHUB_WORKSPACE/kernel/common"

          git init
          git remote add origin "$KERNEL_REPO"

          TAG_REF="refs/tags/$KERNEL_REF"
          BRANCH_REF="refs/heads/$KERNEL_REF"

          if git ls-remote --exit-code --refs origin \
            "$TAG_REF" >/dev/null 2>&1; then

            echo "Found tag: $KERNEL_REF"
            git fetch --depth=1 origin "$TAG_REF"
            git checkout --detach FETCH_HEAD

          elif git ls-remote --exit-code --heads origin \
            "$KERNEL_REF" >/dev/null 2>&1; then

            echo "Found branch: $KERNEL_REF"
            git fetch --depth=1 origin "$BRANCH_REF"
            git checkout -B test-kernel FETCH_HEAD

          else
            echo "::error::Kernel tag or branch not found"
            echo "Repository: $KERNEL_REPO"
            echo "Reference: $KERNEL_REF"
            exit 1
          fi

          echo "===== Kernel revision ====="
          git log -1 --format='%H%n%s'

          echo "===== Kernel version ====="
          make -s kernelversion

      - name: Check NTSync patcher
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f scripts/apply_ntsync.sh ]]; then
            echo "::error::scripts/apply_ntsync.sh not found in main"
            exit 1
          fi

          echo "NTSync patcher found."

      - name: Apply NTSync patch
        shell: bash
        run: |
          set -euo pipefail

          KVER="$(make -s -C kernel/common kernelversion)"

          chmod +x scripts/apply_ntsync.sh

          echo "===== Applying NTSync ====="
          echo "Kernel version: $KVER"

          scripts/apply_ntsync.sh \
            kernel/common \
            "$KVER"

      - name: Verify patch changes
        shell: bash
        run: |
          set -euo pipefail

          cd kernel/common

          echo "===== Patch whitespace validation ====="
          git diff --check

          echo "===== Changed files ====="
          git status --short

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::error::No source changes detected after patching"
            exit 1
          fi

          echo "===== Patch summary ====="
          git diff --stat

          echo "===== NTSync patch test passed ====="
          echo "Changes were detected and git diff --check passed."
          echo "No kernel compilation was performed."

      - name: Final summary
        if: always()
        shell: bash
        run: |
          echo "================================"
          echo "NTSync PATCH TEST"
          echo "================================"
          echo "Branch: main"
          echo "Kernel source: ${{ inputs.kernel_repo }}"
          echo "Kernel reference: ${{ inputs.kernel_ref }}"
          echo "Compilation: disabled"
          echo "Flashing: not performed"
