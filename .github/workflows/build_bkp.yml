
name: NTSync Patch Test

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Repositorio Android Common Source"
        required: true
        type: string
        default: "https://android.googlesource.com/kernel/common"

      kernel_ref:
        description: "Selecciona la versión del kernel"
        required: true
        type: choice
        options:
          - android12-5.10.269_r00
          - android12-5.10.264_r00
          - android12-5.10.246_r00
          - android12-5.10.240_r00
          - android12-5.10.226_r00
          - android12-5.10-lts
          - android12-5.10
        default: android12-5.10.269_r00

jobs:
  test-patch:
    name: Clone and test NTSync
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git python3

      - name: Clone selected kernel reference
        env:
          KERNEL_REPO: ${{ inputs.kernel_repo }}
          KERNEL_REF: ${{ inputs.kernel_ref }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/kernel/common"
          cd "$GITHUB_WORKSPACE/kernel/common"

          git init
          git remote add origin "$KERNEL_REPO"

          TAG_REF="refs/tags/$KERNEL_REF"
          BRANCH_REF="refs/heads/$KERNEL_REF"

          if git ls-remote --exit-code --refs origin \
            "$TAG_REF" >/dev/null 2>&1; then

            echo "Selected tag: $KERNEL_REF"
            git fetch --depth=1 origin "$TAG_REF"
            git checkout --detach FETCH_HEAD

          elif git ls-remote --exit-code --heads origin \
            "$KERNEL_REF" >/dev/null 2>&1; then

            echo "Selected branch: $KERNEL_REF"
            git fetch --depth=1 origin "$BRANCH_REF"
            git checkout -B test-kernel FETCH_HEAD

          else
            echo "::error::Reference not found: $KERNEL_REF"
            exit 1
          fi

          echo "===== Selected revision ====="
          git log -1 --format='%H%n%s'

          echo "===== Kernel version ====="
          make -s kernelversion

      - name: Check NTSync patcher
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f scripts/apply_ntsync.sh ]]; then
            echo "::error::scripts/apply_ntsync.sh is missing from main"
            exit 1
          fi

          echo "NTSync patcher found."

      - name: Apply NTSync patch
        shell: bash
        run: |
          set -euo pipefail

          KVER="$(make -s -C kernel/common kernelversion)"

          chmod +x scripts/apply_ntsync.sh

          scripts/apply_ntsync.sh \
            kernel/common "$KVER"

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail

          cd kernel/common

          echo "===== Check patch formatting ====="
          git diff --check

          echo "===== Changed files ====="
          git status --short

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::error::No changes detected after applying NTSync"
            exit 1
          fi

          echo "===== Patch summary ====="
          git diff --stat

          echo "NTSync patch application completed successfully."
          echo "No kernel compilation was performed."

      - name: Summary
        if: always()
        env:
          KERNEL_REF: ${{ inputs.kernel_ref }}
        shell: bash
        run: |
          echo "===== NTSync Patch Test ====="
          echo "Branch: main"
          echo "Kernel reference: $KERNEL_REF"
          echo "Compilation: disabled"
